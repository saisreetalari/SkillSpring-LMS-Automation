[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts = -v --tb=short

markers =
    smoke: Critical path smoke tests
    regression: Comprehensive regression suite
    data_driven: Tests parameterised from external CSV or JSON files
    catalog: Course catalog and search tests
    enrollment: Course enrollment workflows
    tabs: Multi-window and browser tab handling tests
    frames: iFrame switching and embedded content tests
    quiz: Quiz submission and evaluation tests
    table: Web table traversal and cell extraction tests
